<svg viewBox="0 0 1000 1500" width="1000" height="1500" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="1500" fill="#fafaf8"/><rect width="1000" height="242" fill="#1a5276"/><text x="56" y="104" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">Your first weeks</text><text x="56" y="168" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">in the Netherlands</text><text x="56" y="216" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="24">The 5 things with actual deadlines</text><line x1="104" y1="328" x2="104" y2="1188" stroke="#e0e0d8" stroke-width="3"/><circle cx="104" cy="328" r="34" fill="#1a4a5a"/><text x="104" y="340" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle">1</text><text x="168" y="322" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Register at your gemeente</text><text x="168" y="362" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Within 5 days of arriving, if you're staying</text><text x="168" y="394" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">longer than 4 months.</text><circle cx="104" cy="543" r="34" fill="#1a4a5a"/><text x="104" y="555" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle">2</text><text x="168" y="537" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Get your BSN</text><text x="168" y="577" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Issued at the appointment, or mailed within</text><text x="168" y="609" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">5-10 business days.</text><circle cx="104" cy="758" r="34" fill="#1a4a5a"/><text x="104" y="770" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle">3</text><text x="168" y="752" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Activate DigiD</text><text x="168" y="792" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Apply once you have a BSN; the activation</text><text x="168" y="824" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">letter arrives in about 5 business days.</text><circle cx="104" cy="973" r="34" fill="#1a5276"/><text x="104" y="985" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle">4</text><text x="168" y="967" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Open a bank account</text><text x="168" y="1007" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Most Dutch banks want a BSN first. Some</text><text x="168" y="1039" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">neobanks will open without one.</text><circle cx="104" cy="1188" r="34" fill="#1a6644"/><text x="104" y="1200" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700" text-anchor="middle">5</text><text x="168" y="1182" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Take out health insurance</text><text x="168" y="1222" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Mandatory within 4 months of arrival. Miss it</text><text x="168" y="1254" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">and you're enrolled retroactively, with a</text><text x="168" y="1286" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">penalty.</text><rect y="1404" width="1000" height="96" fill="#1a5276"/><text x="56" y="1444" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Deadlines are strict — check each guide before you arrive.</text><text x="56" y="1476" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="19">hollandexpatguide.com</text></svg>