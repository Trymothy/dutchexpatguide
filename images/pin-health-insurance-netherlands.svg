<svg viewBox="0 0 1000 1500" width="1000" height="1500" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="1500" fill="#fafaf8"/><rect width="1000" height="306" fill="#1a6644"/><text x="56" y="104" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">Dutch health</text><text x="56" y="168" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">insurance: what</text><text x="56" y="232" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">you actually pay</text><text x="56" y="280" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="24">Mandatory basics, 2026</text><rect x="56" y="354" width="432.0" height="196" fill="#1a6644"/><text x="272" y="456" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" text-anchor="middle">€135-165</text><text x="272" y="507" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.88">basic premium, per adult, per month</text><rect x="512.0" y="354" width="432.0" height="196" fill="#155238"/><text x="728" y="456" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" text-anchor="middle">€385</text><text x="728" y="507" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.88">mandatory annual deductible</text><rect x="56" y="586" width="888" height="116" fill="#fdf0e6" stroke="#e0c3a2" stroke-width="2"/><text x="88" y="634" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1.2">THE DEADLINE THAT CARRIES A PENALTY</text><text x="88" y="672" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="27">Take out cover within 4 months of arriving.</text><text x="56" y="742" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" letter-spacing="1.4">BASIC COVER, IDENTICAL AT EVERY INSURER</text><rect x="56" y="772" width="135" height="50" rx="25" fill="#eaf3ee" stroke="#bcd9c8" stroke-width="2"/><text x="124" y="805" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">GP visits</text><rect x="203" y="772" width="249" height="50" rx="25" fill="#eaf3ee" stroke="#bcd9c8" stroke-width="2"/><text x="328" y="805" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Hospital treatment</text><rect x="464" y="772" width="186" height="50" rx="25" fill="#eaf3ee" stroke="#bcd9c8" stroke-width="2"/><text x="557" y="805" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Prescriptions</text><rect x="662" y="772" width="236" height="50" rx="25" fill="#eaf3ee" stroke="#bcd9c8" stroke-width="2"/><text x="780" y="805" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Mental healthcare</text><rect x="56" y="834" width="198" height="50" rx="25" fill="#eaf3ee" stroke="#bcd9c8" stroke-width="2"/><text x="155" y="867" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Maternity care</text><rect x="266" y="834" width="312" height="50" rx="25" fill="#eaf3ee" stroke="#bcd9c8" stroke-width="2"/><text x="422" y="867" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Physiotherapy (limited)</text><rect x="56" y="924" width="888" height="446" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><text x="88" y="978" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" letter-spacing="1.4">THE REST OF THE NUMBERS</text><text x="88" y="1040" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="24">Voluntary deductible, for a lower premium</text><text x="912" y="1040" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">up to €885</text><line x1="88" y1="1058" x2="912" y2="1058" stroke="#e0e0d8" stroke-width="1"/><text x="88" y="1104" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="24">Supplementary dental cover</text><text x="912" y="1104" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€15-30 / month</text><line x1="88" y1="1122" x2="912" y2="1122" stroke="#e0e0d8" stroke-width="1"/><text x="88" y="1168" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="24">Zorgtoeslag limit, single (approx.)</text><text x="912" y="1168" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€37.000</text><line x1="88" y1="1186" x2="912" y2="1186" stroke="#e0e0d8" stroke-width="1"/><text x="88" y="1232" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="24">Zorgtoeslag limit, couple (approx.)</text><text x="912" y="1232" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€47.000</text><line x1="88" y1="1250" x2="912" y2="1250" stroke="#e0e0d8" stroke-width="1"/><rect y="1404" width="1000" height="96" fill="#1a5276"/><text x="56" y="1444" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Premiums differ by insurer — compare before you sign.</text><text x="56" y="1476" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="19">hollandexpatguide.com</text></svg>