<svg viewBox="0 0 1000 1500" width="1000" height="1500" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="1500" fill="#fafaf8"/><rect width="1000" height="306" fill="#7d3c1a"/><text x="56" y="104" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">The 30% ruling</text><text x="56" y="168" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">changed again</text><text x="56" y="232" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">in 2026</text><text x="56" y="280" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="24">What expats actually get now</text><text x="56" y="362" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">IF YOU APPLIED UNDER THE 2024 RULES</text><rect x="56" y="388" width="296" height="104" fill="#a8571f"/><text x="204" y="438" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" text-anchor="middle">30%</text><text x="204" y="470" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.85">20 months</text><rect x="352" y="388" width="296" height="104" fill="#c1834f"/><text x="500" y="438" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" text-anchor="middle">20%</text><text x="500" y="470" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.85">20 months</text><rect x="648" y="388" width="296" height="104" fill="#dcb494"/><text x="796" y="438" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" text-anchor="middle">10%</text><text x="796" y="470" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.85">20 months</text><text x="56" y="534" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Averaged 20% across the five years.</text><text x="56" y="626" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">IF YOU APPLY FROM 1 JANUARY 2026</text><rect x="56" y="652" width="444" height="104" fill="#7d3c1a"/><text x="278" y="702" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" text-anchor="middle">30%</text><text x="278" y="734" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.85">30 months</text><rect x="500" y="652" width="444" height="104" fill="#a8571f"/><text x="722" y="702" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="42" font-weight="700" text-anchor="middle">25%</text><text x="722" y="734" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.85">30 months</text><text x="56" y="798" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Averages 27.5% — the second half is no longer 20% then 10%.</text><rect x="56" y="844" width="888" height="196" fill="#e8f0f7" stroke="#e0e0d8" stroke-width="2"/><text x="88" y="906" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28">Already on the 2024 schedule? You stay on it</text><text x="88" y="946" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28">unless you switch — which is generally worth</text><text x="88" y="986" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28">doing, and your payroll provider handles it.</text><text x="56" y="1112" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1.5">2026 MINIMUM SALARY TO QUALIFY</text><text x="56" y="1170" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="25">Standard</text><text x="944" y="1170" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" text-anchor="end">€46.107</text><line x1="56" y1="1188" x2="944" y2="1188" stroke="#e0e0d8" stroke-width="1"/><text x="56" y="1224" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="25">Under 30 with a master's</text><text x="944" y="1224" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="27" font-weight="700" text-anchor="end">€35.048</text><line x1="56" y1="1242" x2="944" y2="1242" stroke="#e0e0d8" stroke-width="1"/><text x="56" y="1286" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-style="italic">Taxable salary after the 30% is deducted.</text><rect y="1404" width="1000" height="96" fill="#1a5276"/><text x="56" y="1444" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">Thresholds are indexed yearly — verify before you rely on them.</text><text x="56" y="1476" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="19">hollandexpatguide.com</text></svg>