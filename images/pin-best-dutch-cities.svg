<svg viewBox="0 0 1000 1500" width="1000" height="1500" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="1500" fill="#fafaf8"/><rect width="1000" height="306" fill="#1a5276"/><text x="56" y="104" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">Which Dutch city</text><text x="56" y="168" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">should you</text><text x="56" y="232" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">live in?</text><text x="56" y="280" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="24">Five cities, honestly compared</text><rect x="56" y="346" width="888" height="187" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="346" width="10" height="187" fill="#1a5276"/><text x="92" y="398" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Amsterdam</text><text x="912" y="398" fill="#1a5276" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€1.800-2.400</text><text x="92" y="438" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">Most international, best culture — and the hardest</text><text x="92" y="468" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">housing market.</text><rect x="56" y="551" width="888" height="187" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="551" width="10" height="187" fill="#1a4a5a"/><text x="92" y="603" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Utrecht</text><text x="912" y="603" fill="#1a4a5a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€1.400-1.900</text><text x="92" y="643" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">Central, walkable, well connected. Amsterdam prices</text><text x="92" y="673" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">are catching up.</text><rect x="56" y="756" width="888" height="187" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="756" width="10" height="187" fill="#1a6644"/><text x="92" y="808" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">The Hague</text><text x="912" y="808" fill="#1a6644" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€1.300-1.800</text><text x="92" y="848" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">Government, courts and NGOs. Coastal, and quieter</text><text x="92" y="878" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">than Amsterdam.</text><rect x="56" y="961" width="888" height="187" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="961" width="10" height="187" fill="#4a235a"/><text x="92" y="1013" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Rotterdam</text><text x="912" y="1013" fill="#4a235a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€1.100-1.500</text><text x="92" y="1053" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">Rents 30-40% below Amsterdam. Modern, and long</text><text x="92" y="1083" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">overlooked.</text><rect x="56" y="1166" width="888" height="187" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="1166" width="10" height="187" fill="#7d3c1a"/><text x="92" y="1218" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">Eindhoven</text><text x="912" y="1218" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€1.000-1.500</text><text x="92" y="1258" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">Tech and ASML's Brainport. Best value of the major</text><text x="92" y="1288" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="22">hubs.</text><rect y="1404" width="1000" height="96" fill="#1a5276"/><text x="56" y="1444" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">One-bedroom rent, per month. The right pick usually follows the job.</text><text x="56" y="1476" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="19">hollandexpatguide.com</text></svg>