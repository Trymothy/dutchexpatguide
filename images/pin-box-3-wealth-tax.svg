<svg viewBox="0 0 1000 1500" width="1000" height="1500" xmlns="http://www.w3.org/2000/svg"><rect width="1000" height="1500" fill="#fafaf8"/><rect width="1000" height="306" fill="#7d3c1a"/><text x="56" y="104" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">Box 3: how Dutch</text><text x="56" y="168" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">wealth tax works</text><text x="56" y="232" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="56" font-weight="700">in 2026</text><text x="56" y="280" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="24">You're taxed on an assumed return, not your real one</text><text x="56" y="354" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" letter-spacing="1.4">ASSUMED RETURN, BY ASSET TYPE</text><rect x="56" y="388" width="888" height="86" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="388" width="10" height="86" fill="#c1834f"/><text x="92" y="442" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28">Savings &amp; bank deposits</text><text x="912" y="444" fill="#c1834f" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" text-anchor="end">1,44%</text><rect x="56" y="486" width="888" height="86" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="486" width="10" height="86" fill="#7d3c1a"/><text x="92" y="540" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28">Investments &amp; other assets</text><text x="912" y="542" fill="#7d3c1a" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" text-anchor="end">6,04%</text><rect x="56" y="584" width="888" height="86" fill="#ffffff" stroke="#e0e0d8" stroke-width="2"/><rect x="56" y="584" width="10" height="86" fill="#9c9c9c"/><text x="92" y="638" fill="#1a1a1a" font-family="Georgia, 'Times New Roman', serif" font-size="28">Debts (subtracted)</text><text x="912" y="640" fill="#9c9c9c" font-family="Georgia, 'Times New Roman', serif" font-size="38" font-weight="700" text-anchor="end">2,62%</text><rect x="56" y="694" width="432.0" height="158" fill="#7d3c1a"/><text x="272" y="776" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" text-anchor="middle">36%</text><text x="272" y="817" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.88">tax on the assumed return</text><rect x="512.0" y="694" width="432.0" height="158" fill="#5d2e0c"/><text x="728" y="776" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="700" text-anchor="middle">€57.684</text><text x="728" y="817" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="21" text-anchor="middle" opacity="0.88">tax-free, per person</text><rect x="56" y="886" width="888" height="206" fill="#e8f0f7" stroke="#e0e0d8" stroke-width="2"/><text x="88" y="932" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" letter-spacing="1.4">WORKED EXAMPLE</text><text x="88" y="978" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="23">€40.000 savings + €100.000 investments</text><text x="88" y="1022" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Assumed return after the allowance</text><text x="912" y="1022" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€3.910</text><text x="88" y="1066" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="23">Tax actually owed</text><text x="912" y="1066" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="25" font-weight="700" text-anchor="end">€1.408</text><text x="56" y="1132" fill="#1a1a1a" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-weight="700" letter-spacing="1.4">WHAT COUNTS AS A BOX 3 ASSET</text><rect x="56" y="1158" width="110" height="50" rx="25" fill="#fdf0e6" stroke="#e0c3a2" stroke-width="2"/><text x="111" y="1191" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Savings</text><rect x="178" y="1158" width="186" height="50" rx="25" fill="#fdf0e6" stroke="#e0c3a2" stroke-width="2"/><text x="271" y="1191" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Stocks &amp; ETFs</text><rect x="376" y="1158" width="98" height="50" rx="25" fill="#fdf0e6" stroke="#e0c3a2" stroke-width="2"/><text x="425" y="1191" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Crypto</text><rect x="486" y="1158" width="173" height="50" rx="25" fill="#fdf0e6" stroke="#e0c3a2" stroke-width="2"/><text x="572" y="1191" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Second homes</text><rect x="671" y="1158" width="224" height="50" rx="25" fill="#fdf0e6" stroke="#e0c3a2" stroke-width="2"/><text x="783" y="1191" fill="#7d3c1a" font-family="system-ui, -apple-system, sans-serif" font-size="22" text-anchor="middle">Loans receivable</text><text x="56" y="1242" fill="#666666" font-family="system-ui, -apple-system, sans-serif" font-size="21" font-style="italic">Not your primary home, pension, or household possessions.</text><rect y="1404" width="1000" height="96" fill="#1a5276"/><text x="56" y="1444" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="600">On the 30% ruling? Foreign assets may fall outside Box 3 entirely.</text><text x="56" y="1476" fill="#bcd4e6" font-family="system-ui, -apple-system, sans-serif" font-size="19">hollandexpatguide.com</text></svg>